# @Per-app effects
# Translucency is set inside each app (kitty: background_opacity, from the theme)

# kitty terminal
for_window [app_id="kitty"] blur enable

# packages (floating)
for_window [app_id="floating_update"] floating enable, resize set 900 600, blur enable

# jukebox
for_window [app_id="feishin"] mark jukebox, floating enable, resize set 1280 600, move position center, move scratchpad, scratchpad show

# Video and games
for_window [app_id="mpv"] dim_inactive 0
for_window [class="^steam_app_"] dim_inactive 0, shadows disable, blur disable

# @Per-layer effects
layer_effects "swaync-notification-window" blur enable; blur_ignore_transparent enable
layer_effects "swaync-control-center" blur enable; blur_ignore_transparent enable
layer_effects "rofi" blur enable
layer_effects "logout_dialog" blur enable
