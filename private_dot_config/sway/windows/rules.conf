# @Per-app effects
# Translucency is set inside each app (kitty: background_opacity, from the theme).
# An opacity rule here would also fade the text, so it is not used.

# kitty terminal
for_window [app_id="kitty"] blur enable

# actualizaciones (floating)
for_window [app_id="floating_update"] floating enable, resize set 900 600, opacity 0.75, blur enable

# @Per-layer effects
# blur_ignore_transparent: these layer surfaces are much bigger than the cards they draw;
# without it the whole surface is blurred, not just the notifications / panel.
layer_effects "swaync-notification-window" blur enable; blur_ignore_transparent enable
layer_effects "swaync-control-center" blur enable; blur_ignore_transparent enable
layer_effects "rofi" blur enable
layer_effects "logout_dialog" blur enable
